# Publishes to PyPI when a version tag (vX.Y.Z) is pushed, through PyPI trusted publishing: no token is stored.
# The PyPI side trusts exactly this repository, this workflow file and the `pypi` environment, whose deployments a
# maintainer approves in GitHub before the upload starts. A GitHub release with the CHANGELOG notes follows the upload.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # the whole of ci.yml first: a tag publishes nothing that has not passed it
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag must equal the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: The newest CHANGELOG.md section must be this version, with its date
        run: |
          newest=$(grep -m1 '^## ' CHANGELOG.md)
          version="${GITHUB_REF_NAME#v}"
          echo "$newest" | grep -Eq "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" \
            || { echo "CHANGELOG.md's newest section is '$newest', not '## $version (YYYY-MM-DD)'"; exit 1; }
      - name: The paper's arXiv number must be filled in
        run: |
          if grep -rn "XXXX.XXXXX" README.md CITATION.cff docs; then
            echo "the citation still has the placeholder XXXX.XXXXX: put the paper's arXiv number first"; exit 1
          fi
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade "build>=1.2" "twine>=6.1"
          python -m build
          python -m twine check --strict dist/*
      - name: The PyPI page must not hold the arXiv placeholder
        run: |
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -n "XXXX.XXXXX"; then
            echo "the PyPI page still has the placeholder XXXX.XXXXX"; exit 1
          fi
      - name: The wheel that will be uploaded installs and makes the Quick start prediction
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export SERVECAST_DATA_DIR="$RUNNER_TEMP/data" SERVECAST_CACHE_DIR="$RUNNER_TEMP/cache"
          sc="$RUNNER_TEMP/smoke/bin/servecast"
          test "$("$sc" --version)" = "servecast ${GITHUB_REF_NAME#v}"
          "$sc" calibrate --data a100_sxm_40gb/c62ebe75 --name smoke-test
          "$sc" manifest show example-a100 > example-a100.yaml
          "$sc" predict -c example-a100.yaml --with smoke-test --output-dir prediction
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # the release page on GitHub, once PyPI has the files: the newest CHANGELOG.md section, and the same files
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release with the CHANGELOG notes and the files PyPI received
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ServeCast ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
